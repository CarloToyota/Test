[package]
name = "band-transcriber"
version = "0.1.0"
description = "Real-time, on-device transcription for concert and jazz band instruments"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "band_transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["capture"]
# Microphone capture through cpal (`audio_engine::capture`). The rest of `audio_engine`
# never touches it, so the DSP core also builds alone, e.g. for wasm32 where audio comes
# from Web Audio instead (see README).
capture = ["dep:cpal", "dep:rtrb"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["sync"] }
pitch-detection = "0.3.0"
cpal = { version = "0.18.2", optional = true }
rtrb = { version = "0.4.1", optional = true }
tauri-plugin-dialog = "2.4"

[profile.dev.package."*"]
# The DSP must run at full speed even in `tauri dev`, or it falls behind real time.
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
